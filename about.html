<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portsite</title>
  <meta name="description" content="Experience, skills and education.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='19' y='18' width='62' height='44' rx='5' fill='none' stroke='%23e50914' stroke-width='8'/%3E%3Cpath d='M5 71 H95 L89 82 H11 Z' fill='%23e50914'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=26">
</head>
<body class="page-about site-ready">
  <div id="site" class="site">
    <nav class="nav" id="nav" aria-label="Main">
      <div class="nav-inner">
        <a class="nav-title" href="index.html" data-name data-home-link>Profile</a>
        <div class="nav-right">
          <button class="nav-toggle" id="navToggle" type="button" aria-expanded="false" aria-controls="navLinks" aria-label="Show sections">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6l5 5 5-5"/></svg>
          </button>
          <ul class="nav-links" id="navLinks">
            <li><a href="index.html#highlights" data-home-link="#highlights">Highlights</a></li>
            <li><a href="index.html#projects" data-home-link="#projects">Projects</a></li>
            <li><a href="about.html" aria-current="page">About</a></li>
            <li><a href="#contact">Contact</a></li>
          </ul>
          <a class="person-chip" id="personChip" href="index.html?pick" aria-label="Switch profile">
            <span class="avatar avatar-sm" id="chipAvatar"></span>
            <span class="person-chip-label" id="chipLabel"></span>
          </a>
        </div>
      </div>
    </nav>

    <main>
      <section class="a-hero" data-theme="light">
        <div class="wrap hero-grid" id="heroGrid">
          <div>
            <p class="eyebrow">About</p>
            <h1 class="hero-title" id="aboutName"></h1>
            <p class="hero-sub" id="aboutIntro"></p>
          </div>
          <figure class="hero-photo" id="heroPhoto" hidden></figure>
        </div>
      </section>

      <section class="a-story" data-theme="light" id="storySection">
        <div class="wrap"><p class="scrub-text" id="scrubText"></p></div>
      </section>

      <section class="a-numbers" data-theme="light" id="statsSection">
        <div class="wrap">
          <h2 class="h2 reveal">By the numbers.</h2>
          <div class="stats" id="stats"></div>
        </div>
      </section>

      <section class="a-exp" id="experience" data-theme="light">
        <div class="wrap">
          <h2 class="h2 reveal">Experience.</h2>
          <ol class="exp" id="exp"></ol>
        </div>
      </section>

      <section class="a-specs" id="specs" data-theme="light">
        <div class="wrap">
          <h2 class="h2 reveal">Tech Specs</h2>
          <dl class="spec-table" id="specTable"></dl>
        </div>
      </section>

      <section class="contact" id="contact" data-theme="dark">
        <div class="wrap reveal">
          <p class="eyebrow eyebrow-dark">Contact</p>
          <h2 class="contact-title">Let’s talk.</h2>
          <a class="contact-email" id="contactEmail" href="#"></a>
          <div class="contact-links" id="contactLinks"></div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="wrap footer-inner">
        <div class="footer-links">
          <a href="index.html?intro">Replay intro</a>
          <a href="index.html?pick">Switch profile</a>
          <a href="index.html" data-home-link>Home</a>
        </div>
        <p id="copyright"></p>
      </div>
    </footer>
  </div>

  <script src="data.js?v=26"></script>
  <script src="script.js?v=26"></script>
</body>
</html>
