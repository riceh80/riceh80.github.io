<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portsite</title>
  <meta name="description" content="Experience, skills and education.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='19' y='18' width='62' height='44' rx='5' fill='none' stroke='%23e50914' stroke-width='8'/%3E%3Cpath d='M5 71 H95 L89 82 H11 Z' fill='%23e50914'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=55">
</head>
<body class="page-about site-ready">
  <div id="site" class="site">
    <nav class="nav" id="nav" aria-label="Main">
      <div class="nav-inner">
        <a class="nav-title" href="index.html" data-name data-home-link>Profile</a>
        <div class="nav-right">
          <button class="nav-toggle" id="navToggle" type="button" aria-expanded="false" aria-controls="navLinks" aria-label="Show sections">
            <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 6l5 5 5-5"/></svg>
          </button>
          <ul class="nav-links" id="navLinks">
            <li><a href="index.html#highlights" data-home-link="#highlights">Highlights</a></li>
            <li><a href="index.html#projects" data-home-link="#projects">Projects</a></li>
            <li><a href="about.html" aria-current="page">About</a></li>
            <li><a href="#contact">Contact</a></li>
          </ul>
          <a class="person-chip" id="personChip" href="index.html?pick" aria-label="Switch profile">
            <span class="avatar avatar-sm" id="chipAvatar"></span>
            <span class="person-chip-label" id="chipLabel"></span>
          </a>
        </div>
      </div>
    </nav>

    <main>
      <section class="a-hero" data-theme="light">
        <div class="wrap">
          <!-- your name in the middle, handwritten notes pointing at it from the corners -->
          <div class="a-sketch" id="aboutSketch">
            <p class="eyebrow a-eyebrow">About</p>
            <h1 class="hero-title a-name" id="aboutName"></h1>
          </div>
          <p class="a-story" id="aboutStory"></p>
        </div>
      </section>

      <!-- OFF THE CLOCK: live game + music from Discord, and the games played -->
      <section class="a-fun" data-theme="light" id="funSection">
        <div class="wrap">
          <h2 class="h2 reveal">Off the clock.</h2>
          <div class="fun-grid">
            <article class="fun-card reveal" id="funPlaying" hidden>
              <svg class="fun-doodle" viewBox="0 0 120 92" aria-hidden="true"><g filter="url(#boil)"><path d="M30 30H90A22 22 0 0 1 110 60L105 75A9 9 0 0 1 90 78L82 69H38L30 78A9 9 0 0 1 15 75L10 60A22 22 0 0 1 30 30Z"/><path d="M38 44V56M32 50H44"/><circle class="fill" cx="80" cy="46" r="3.5"/><circle class="fill" cx="89" cy="54" r="3.5"/></g></svg>
              <p class="fun-label"><span class="fun-dot"></span><span id="funPlayingLabel">Playing now</span></p>
              <div class="fun-main">
                <img class="fun-art" id="funGameArt" alt="" hidden>
                <span class="fun-art fun-laptop" id="funGameDoodle" aria-hidden="true" hidden>
                  <svg viewBox="0 0 64 64"><g filter="url(#boil)">
                    <path class="lt" d="M14 15H50A3 3 0 0 1 53 18V41H11V18A3 3 0 0 1 14 15Z"/>
                    <path class="lt" d="M6 44H58L55 49H9Z"/>
                    <path class="code c1 key" pathLength="1" d="M16 21H24"/>
                    <path class="code c2" pathLength="1" d="M26 21H38"/>
                    <path class="code c3" pathLength="1" d="M20 26.5H34"/>
                    <path class="code c4 key" pathLength="1" d="M20 32H27"/>
                    <path class="code c5" pathLength="1" d="M29 32H41"/>
                    <path class="code c6" pathLength="1" d="M16 37H21"/>
                    <rect class="cursor" x="23" y="34.6" width="2.6" height="4.6"/>
                  </g></svg>
                </span>
                <div>
                  <p class="fun-title" id="funGame"></p>
                  <p class="fun-sub" id="funGameSub"></p>
                </div>
              </div>
            </article>
            <article class="fun-card reveal" id="funListening" style="--d:.08s" hidden>
              <svg class="fun-doodle" viewBox="0 0 120 92" aria-hidden="true"><g filter="url(#boil)"><path d="M28 58V46A32 32 0 0 1 92 46V58"/><path d="M22 52H34A4 4 0 0 1 38 56V74A4 4 0 0 1 34 78H22A4 4 0 0 1 18 74V56A4 4 0 0 1 22 52Z"/><path d="M86 52H98A4 4 0 0 1 102 56V74A4 4 0 0 1 98 78H86A4 4 0 0 1 82 74V56A4 4 0 0 1 86 52Z"/><path class="accent" d="M50 22Q56 14 60 20M64 18Q70 10 74 16"/></g></svg>
              <p class="fun-label"><span class="fun-dot"></span><span id="funSongLabel">Listening now</span></p>
              <a class="fun-main fun-song" id="funSongLink" target="_blank" rel="noopener">
                <img class="fun-art fun-cover" id="funCover" alt="" hidden>
                <div>
                  <p class="fun-title fun-title-sm" id="funSong"></p>
                  <p class="fun-sub" id="funArtist"></p>
                </div>
              </a>
              <div class="fun-progress" id="funProgress" hidden><span id="funProgressBar"></span></div>
              <p class="fun-times" id="funTimes" hidden><span id="funElapsed"></span><span id="funDuration"></span></p>
            </article>
            <article class="fun-card reveal" id="funGames" style="--d:.16s">
              <svg class="fun-doodle" viewBox="0 0 120 92" aria-hidden="true"><g filter="url(#boil)"><path d="M24 66L60 80L96 66L60 52Z"/><path d="M24 52L60 66L96 52L60 38Z"/><path class="accent" d="M24 38L60 52L96 38L60 24Z"/></g></svg>
              <p class="fun-label">Games I play</p>
              <ul class="fun-games" id="funGamesList"></ul>
            </article>
          </div>
        </div>
      </section>

      <section class="a-numbers" data-theme="light" id="statsSection">
        <div class="wrap">
          <h2 class="h2 reveal">By the numbers.</h2>
          <div class="stats" id="stats"></div>
        </div>
      </section>

      <section class="a-exp" id="experience" data-theme="light">
        <div class="wrap">
          <h2 class="h2 reveal">Experience.</h2>
          <ol class="exp" id="exp"></ol>
        </div>
      </section>

      <section class="a-specs" id="specs" data-theme="light">
        <div class="wrap">
          <h2 class="h2 reveal">Tech Specs</h2>
          <dl class="spec-table" id="specTable"></dl>
        </div>
      </section>

      <section class="contact" id="contact" data-theme="dark">
        <div class="wrap reveal">
          <p class="eyebrow eyebrow-dark">Contact</p>
          <h2 class="contact-title">Let’s talk.</h2>
          <a class="contact-email" id="contactEmail" href="#"></a>
          <div class="contact-links" id="contactLinks"></div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="wrap footer-inner">
        <div class="footer-links">
          <a href="index.html?intro">Replay intro</a>
          <a href="index.html?pick">Switch profile</a>
          <a href="index.html" data-home-link>Home</a>
        </div>
        <p id="copyright"></p>
      </div>
    </footer>
  </div>

  <script src="data.js?v=55"></script>
  <script src="script.js?v=55"></script>
</body>
</html>
